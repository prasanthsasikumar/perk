<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" fill="#FFFFFF">
  <!-- Grid Lines -->
  <line x1="400" y1="0" x2="400" y2="800" stroke="#E5E5E5" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="800" stroke="#E5E5E5" stroke-width="1"/>
  <line x1="0" y1="400" x2="1200" y2="400" stroke="#E5E5E5" stroke-width="1"/>

  <!-- Cell 1: Chevron -->
  <g transform="translate(130, 130) scale(1.4)">
    <path d="M20 70 L50 35 L80 70 L70 78 L50 53 L30 78 Z" fill="#C95A2B"/>
    <path d="M20 45 L50 10 L80 45 L70 53 L50 28 L30 53 Z" fill="#C95A2B"/>
  </g>

  <!-- Cell 2: Stamp Star Grid -->
  <g transform="translate(530, 130) scale(1.4)">
    <rect x="20" y="20" width="12" height="12" fill="#C95A2B"/>
    <circle cx="50" cy="26" r="6" fill="#C95A2B"/>
    <rect x="68" y="20" width="12" height="12" rx="3" fill="#C95A2B"/>
    <circle cx="26" cy="50" r="6" fill="#C95A2B"/>
    <path d="M50 32 L54 44 L66 48 L54 52 L50 64 L46 52 L34 48 L46 44 Z" fill="#C95A2B"/>
    <circle cx="74" cy="50" r="6" fill="#C95A2B"/>
    <rect x="20" y="68" width="12" height="12" fill="#C95A2B"/>
    <circle cx="50" cy="74" r="6" fill="#C95A2B"/>
    <circle cx="74" cy="74" r="6" fill="#C95A2B"/>
  </g>

  <!-- Cell 3: Wordmark -->
  <g transform="translate(870, 160) scale(1.2)">
    <path fill-rule="evenodd" clip-rule="evenodd" d="M10 10 H35 C44 10 50 16 50 25 C50 34 44 40 35 40 H22 V50 H10 V10 Z M22 20 V30 H33 C36 30 38 28 38 25 C38 22 36 20 33 20 H22 Z" fill="#C95A2B"/>
    <path d="M22 17 L24 22 L29 24 L24 26 L22 31 L20 26 L15 24 L20 22 Z" fill="#FFFFFF"/>
    <text x="56" y="48" font-family="'Space Grotesk', 'Arial', sans-serif" font-weight="700" font-size="44" fill="#C95A2B" letter-spacing="-1">erk</text>
  </g>

  <!-- Cell 4: Encircled Star -->
  <g transform="translate(130, 530) scale(1.4)">
    <circle cx="50" cy="50" r="42" stroke="#C95A2B" stroke-width="8" fill="none"/>
    <path d="M50 20 C50 36 36 50 20 50 C36 50 50 64 50 80 C50 64 64 50 80 50 C64 50 50 36 50 20 Z" fill="#C95A2B"/>
  </g>

  <!-- Cell 5: Staircase Ledger -->
  <g transform="translate(530, 530) scale(1.4)">
    <rect x="15" y="70" width="18" height="18" fill="#C95A2B"/>
    <rect x="37" y="52" width="18" height="36" fill="#C95A2B"/>
    <rect x="59" y="34" width="18" height="54" fill="#C95A2B"/>
    <rect x="81" y="16" width="18" height="72" fill="#C95A2B"/>
  </g>

  <!-- Cell 6: Keyhole P-Stamp -->
  <g transform="translate(930, 530) scale(1.4)">
    <path fill-rule="evenodd" clip-rule="evenodd" d="M30 15 H65 C78.8 15 90 26.2 90 40 C90 53.8 78.8 65 65 65 H50 V85 H30 V15 Z M50 33 V47 H63 C66.9 47 70 43.9 70 40 C70 36.1 66.9 33 63 33 H50 Z" fill="#C95A2B"/>
    <rect x="30" y="65" width="8" height="6" fill="#FFFFFF"/>
    <rect x="30" y="77" width="8" height="6" fill="#FFFFFF"/>
  </g>
